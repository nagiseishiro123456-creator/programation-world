name: Verificar proyecto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources:
    name: Recursos y contratos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verificar rutas y JSON
        run: node tools/check-repository.cjs
      - name: Verificar marcha
        run: node tools/art-preview/check-avatar-walk.cjs
      - name: Verificar colores
        run: node tools/art-preview/check-avatar-appearance.cjs
      - name: Verificar composición de cabeza y cabello
        run: node tools/art-preview/check-avatar-head.cjs
      - name: Verificar flujo del controlador
        run: node tools/art-preview/check-avatar-head-controller.cjs
      - name: Verificar datos de colores
        run: python tools/art-preview/build-avatar-appearance-data.py --check
      - name: Verificar datos de cabeza
        run: python tools/art-preview/build-avatar-head-data.py --check
